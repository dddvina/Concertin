<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar | ConcertIn</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body data-page="auth">
    <nav class="site-nav">
        <div style="display:flex; align-items:center; gap:1rem;">
            <a href="javascript:history.back()" class="btn-back-nav" aria-label="Kembali"><i class="fas fa-arrow-left"></i></a>
            <a href="index.html" class="logo"><span class="logo-mark"><i class="fas fa-music"></i></span>Concert<span>In</span></a>
        </div>
    </nav>
    <div class="auth-container">
        <h2>Daftar Akun Baru</h2>
        <form id="registerForm">
            <div class="field field-wide">
                <i class="fas fa-user"></i>
                <input type="text" id="name" placeholder="Nama Lengkap" required>
            </div>
            <div class="field field-wide">
                <i class="fas fa-envelope"></i>
                <input type="email" id="email" placeholder="Email" required>
            </div>
            <div class="field field-wide">
                <i class="fas fa-lock"></i>
                <input type="password" id="password" placeholder="Password" required>
            </div>
            <button type="submit" class="btn btn-primary" id="registerBtn">Daftar</button>
        </form>
        <p>Sudah punya akun? <a href="login.html">Masuk di sini</a></p>
    </div>

    <script src="script.js"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('registerBtn');
            
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Memproses...';
            
            try {
                const data = await APIClient.post('/api/auth/register', { name, email, password });
                Toast.success(data.message || 'Registrasi berhasil!');
                setTimeout(() => window.location.href = 'login.html', 1500);
            } catch (err) {
                Toast.error(err.message);
                btn.disabled = false;
                btn.textContent = 'Daftar';
            }
        });
    </script>
</body>
</html>
