<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Pembayaran | ConcertIn</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav id="navbar" style="background: var(--bg-secondary);">
        <a href="index.html" class="logo"><i class="fas fa-music"></i> Concert<span>In</span></a>
        <div class="nav-actions" id="navActions"></div>
    </nav>
    <main style="margin-top: 100px;">
        <h2 class="section-title" style="margin-bottom: 1rem;">Selesaikan Pembayaran</h2>
        <div class="checkout-grid">
            <div class="payment-card">
                <h3>Metode Pembayaran</h3>
                <div class="payment-methods" style="margin-top: 1.5rem;">
                    <label class="payment-option" style="display: block; padding: 1rem; border: 1px solid var(--accent); border-radius: 10px; margin-bottom: 1rem; cursor: pointer; background: rgba(102,252,241,0.1);">
                        <input type="radio" name="payment" value="gopay" checked>
                        <i class="fas fa-wallet" style="margin: 0 10px;"></i> GoPay
                    </label>
                    <label class="payment-option" style="display: block; padding: 1rem; border: 1px solid rgba(255,255,255,0.2); border-radius: 10px; cursor: pointer;">
                        <input type="radio" name="payment" value="bank">
                        <i class="fas fa-university" style="margin: 0 10px;"></i> Transfer Bank
                    </label>
                </div>
                <button class="btn btn-primary" style="width: 100%; margin-top: 2rem;" onclick="processPayment()">Bayar Sekarang</button>
            </div>
            <div class="summary-card" id="summaryCard">
                <h3>Ringkasan Pesanan</h3>
                <p>Memuat ringkasan...</p>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', loadCheckoutSummary);
    </script>
</body>
</html>
