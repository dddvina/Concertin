<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesan Tiket | ConcertIn</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body data-page="booking">
    <nav class="site-nav">
        <div style="display:flex; align-items:center; gap:1rem;">
            <a href="javascript:history.back()" class="btn-back-nav" aria-label="Kembali"><i class="fas fa-arrow-left"></i></a>
            <a href="index.html" class="logo"><span class="logo-mark"><i class="fas fa-music"></i></span>Concert<span>In</span></a>
        </div>
        <div class="nav-actions"></div>
    </nav>
    <div class="booking-container">
        <h2>Pesan Tiket</h2>
        <div class="concert-name" id="concertName">Memuat konser...</div>
        
        <form id="bookingForm" style="display:none;">
            <div class="field-group">
                <label for="category">Pilih Kategori Tiket</label>
                <select id="category" required>
                    <option value="" disabled selected>Pilih Kategori</option>
                </select>
            </div>
            
            <div class="field-group">
                <label for="quantity">Jumlah Tiket</label>
                <input type="number" id="quantity" min="1" max="4" value="1" required>
            </div>
            
            <div class="summary">
                <p><span>Harga per tiket:</span> <span id="pricePerTicket">Rp0</span></p>
                <p class="total"><span>Total Bayar:</span> <span id="totalPrice">Rp0</span></p>
            </div>
            
            <button type="submit" class="btn btn-primary btn-block" id="payBtn">Pesan & Lanjut Bayar</button>
        </form>
        <div id="loadingState" class="spinner"></div>
        <div id="errorState" class="empty-state" style="display:none; text-align:center;">
            Gagal memuat detail konser. Pastikan kamu membuka halaman ini dari halaman Beranda.
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if (!AuthManager.requireAuth('index.html')) return;
            
            const urlParams = new URLSearchParams(window.location.search);
            const concertId = urlParams.get('concertId');
            const concertTitle = urlParams.get('concert');
            
            if (concertTitle) document.getElementById('concertName').textContent = concertTitle;
            
            if (!concertId) {
                document.getElementById('loadingState').style.display = 'none';
                document.getElementById('errorState').style.display = 'block';
                return;
            }

            let tickets = [];
            
            try {
                const data = await APIClient.get('/api/concerts/' + concertId);
                tickets = data.concert.tickets || [];
                
                const categorySelect = document.getElementById('category');
                tickets.forEach(t => {
                    const option = document.createElement('option');
                    option.value = t.ticketId;
                    option.dataset.price = t.price;
                    option.dataset.quota = t.remainingQuota;
                    option.textContent = `${t.category} - Rp${t.price.toLocaleString('id-ID')} (Sisa: ${t.remainingQuota})`;
                    if (t.remainingQuota <= 0) option.disabled = true;
                    categorySelect.appendChild(option);
                });
                
                document.getElementById('loadingState').style.display = 'none';
                document.getElementById('bookingForm').style.display = 'block';
            } catch (err) {
                Toast.error('Gagal memuat tiket. Pastikan server backend API berjalan.');
                document.getElementById('loadingState').style.display = 'none';
                document.getElementById('errorState').style.display = 'block';
            }
            
            function updateTotal() {
                const categorySelect = document.getElementById('category');
                const quantityInput = document.getElementById('quantity');
                
                if (categorySelect.selectedIndex === 0) return;
                
                const selectedOption = categorySelect.options[categorySelect.selectedIndex];
                const price = parseInt(selectedOption.dataset.price);
                const quantity = parseInt(quantityInput.value) || 1;
                const maxQuota = parseInt(selectedOption.dataset.quota);
                
                if (quantity > maxQuota) {
                    Toast.error(`Kuota tidak cukup! Sisa tiket: ${maxQuota}`);
                    quantityInput.value = maxQuota;
                    return updateTotal();
                }
                
                document.getElementById('pricePerTicket').textContent = 'Rp' + price.toLocaleString('id-ID');
                document.getElementById('totalPrice').textContent = 'Rp' + (price * quantity).toLocaleString('id-ID');
            }
            
            document.getElementById('category').addEventListener('change', updateTotal);
            document.getElementById('quantity').addEventListener('change', updateTotal);
            
            document.getElementById('bookingForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const categorySelect = document.getElementById('category');
                if (categorySelect.selectedIndex === 0) {
                    Toast.error('Pilih kategori tiket!');
                    return;
                }
                
                const ticketId = categorySelect.value;
                const quantity = document.getElementById('quantity').value;
                const user = AuthManager.getUser();
                const btn = document.getElementById('payBtn');
                
                btn.disabled = true;
                btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Memproses...';
                
                try {
                    const data = await APIClient.post('/api/orders', {
                        userId: user.userId,
                        concertId: concertId,
                        ticketId: ticketId,
                        quantity: quantity
                    });
                    Toast.success('Pesanan berhasil dibuat!');
                    setTimeout(() => window.location.href = 'orders.html', 1500);
                } catch (err) {
                    Toast.error(err.message);
                    btn.disabled = false;
                    btn.textContent = 'Pesan & Lanjut Bayar';
                }
            });
        });
    </script>
</body>
</html>
